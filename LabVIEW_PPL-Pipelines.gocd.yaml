            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_Windows_64_Release
                pipeline: Actor-Framework.lvlibp
                artifact_id: Actor-Framework_Windows_64_Release_nipkg
