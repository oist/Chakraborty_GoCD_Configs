          Windows_64_Release:
            <<: *job_base_2019_Windows_64_Release
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: AF_Messages-PPL_Windows_64_Release_nipkg
