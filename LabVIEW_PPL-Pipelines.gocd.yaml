format_version: 10
common:
  via_plugin_version: 0.2.2.3
  dir_job:
    tasks:
    - exec:
        command: dir
        arguments:
        - '*'
  via_job:
    environment_variables:
      PROJECT_TITLE: '#{PPL_Name}'
    timeout: 3
    tabs:
      VIA_Results: '#{PPL_Name}/viaResultsCheckstyle.xml'
      VIA_Report: '#{PPL_Name}/CheckstyleReport.html'
    artifacts:
    - build:
        source: '#{GIT_DIR}/viaResultsCheckstyle.xml'
        destination: '#{PPL_Name}'
    - build:
        source: CheckstyleReport.html
        destination: '#{PPL_Name}'
    - build:
        source: '#{GIT_DIR}/viaResults.xml'
        destination: '#{PPL_Name}'
    tasks:
    - exec:
        run_if: passed
        command: g-cli
        working_directory: '#{GIT_DIR}'
        arguments:
        - --verbose
        - --lv-ver
        - '#{LV_VERSION}'
        - viaRunner.vi
        - --
        - viaResults.xml
    - plugin:
        configuration:
          id: Checkstyle.LabVIEW.VIA
          version: 0.2.2.3
        run_if: passed
        options:
          SourceVIAFile: '#{GIT_DIR}/viaResults.xml'
          SourceCheckstyleFile: '#{GIT_DIR}/viaResultsCheckstyle.xml'
          DestinationFile: CheckstyleReport.html
          AddEmpty: false
  PPL_Job: &ppl_job_tasks_no_deps
  - &fetch_builder_task
    fetch:
      run_if: passed
      pipeline: Zip_PPL_Builder
      stage: Zip
      job: Zip
      source: PPL_Builder/PPL_Builder.zip
      destination: .
      is_file: 'yes'
  - &expand_builder_task
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - Expand-Archive
      - -Path
      - PPL_Builder.zip
      - -DestinationPath
      - .
  - &ls_task
    exec:
      run_if: passed
      command: ls
      arguments:
      - '*'
  - &gcli_build_task
    exec:
      run_if: passed
      command: g-cli
      arguments:
      - --lv-ver
      - '#{LV_VERSION}'
      - '%BITNESS_FLAG%'
      - PPL_Builder\Call_Builder_Wiresmith.vi
      - --
      - '#{PPL_LIB_PATH}'
      - PPLs/Current
      - '%IS_DEBUG_BUILD%'
      - '%TARGET_SYSTEM%'
      - '%BUILD_TYPE%'
      - '#{Dependency_PPL_Names}'
  - &print_labview_logs_task
    exec:
      run_if: failed
      command: powershell
      arguments:
      - -NoProfile
      - -NonInteractive
      - -ExecutionPolicy
      - Bypass
      - -File
      - PPL_Builder\Print-LabVIEWLogs.ps1
  - &create_crash_dump_dir_task
    exec:
      run_if: any
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Directory
      - -Path
      - LabVIEW-Crash-Dumps
  mklink_task_Windows_32_Release: &mklink_task_Windows_32_Release
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\Windows\Release_32\"
  mklink_task_Windows_32_Debug: &mklink_task_Windows_32_Debug
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\Windows\Debug_32\"
  mklink_task_Windows_64_Release: &mklink_task_Windows_64_Release
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\Windows\Release_64\"
  mklink_task_Windows_64_Debug: &mklink_task_Windows_64_Debug
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\Windows\Debug_64\"
  mklink_task_cRIO_Release: &mklink_task_cRIO_Release
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\cRIO-9045\Release_32\home\lvuser\natinst\bin\"
  mklink_task_cRIO_Debug: &mklink_task_cRIO_Debug
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Junction
      - -Path
      - PPLs\Current
      - -Target
      - \"C:\LabVIEW Sources\PPLs\cRIO-9045\Debug_32\home\lvuser\natinst\bin\"
  create_ppl_dir_task: &create_ppl_dir_task
    exec:
      run_if: passed
      command: powershell
      arguments:
      - -Command
      - New-Item
      - -Force
      - -ItemType
      - Directory
      - -Path
      - \"C:\LabVIEW Sources\PPLs\"
  ls_current_dir_task: &ls_current_dir_task
    exec:
      run_if: passed
      command: ls
      arguments:
      - PPLs\\Current
  fetch_ppl_configuration: &fetch_ppl_configuration
    options:
      DownloadOrInstall: Install
      SuppressIncompatibilityErrors: false
      AllowUpgrade: true
      AllowDowngrade: true
      AllowUninstallation: false
      InstallRecommended: false
      InstallRootDir: null
  ppl_build_artifact: &ppl_build_artifact
    build:
      source: PPLs/Current/#{PPL_Name}
      destination: '#{PPL_Name}'
  nipkg_build_artifact: &nipkg_build_artifact
    build:
      source: NIPKGs/*
      destination: '#{PPL_Name}'
  crash_dumps_artifact: &crash_dumps_artifact
    build:
      source: LabVIEW-Crash-Dumps
      destination: '#{PPL_Name}/crash-dumps'
  nipkg_store_configuration: &nipkg_store_configuration
    options:
      PackagePath: NIPKGs/*.nipkg
  builder_material: &builder_material
    pipeline: Zip_PPL_Builder
    stage: Zip
    ignore_for_scheduling: true
  fetch_ppl_base_Windows_32_Release: &fetch_ppl_base_Windows_32_Release
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: Windows_32_Release
    configuration: *fetch_ppl_configuration
  fetch_ppl_base_Windows_32_Debug: &fetch_ppl_base_Windows_32_Debug
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: Windows_32_Debug
    configuration: *fetch_ppl_configuration
  fetch_ppl_base_Windows_64_Release: &fetch_ppl_base_Windows_64_Release
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: Windows_64_Release
    configuration: *fetch_ppl_configuration
  fetch_ppl_base_Windows_64_Debug: &fetch_ppl_base_Windows_64_Debug
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: Windows_64_Debug
    configuration: *fetch_ppl_configuration
  fetch_ppl_base_cRIO_Release: &fetch_ppl_base_cRIO_Release
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: cRIO_Release
    configuration: *fetch_ppl_configuration
  fetch_ppl_base_cRIO_Debug: &fetch_ppl_base_cRIO_Debug
    run_if: passed
    artifact_origin: external
    stage: build_ppls
    job: cRIO_Debug
    configuration: *fetch_ppl_configuration
  git_tag_stage: &git_tag_stage
    git_tag:
      approval: success
      fetch_materials: 'yes'
      environment_variables:
        GITHUB_RELEASE_TOKEN: '{{SECRET:[secrets.json][github_publishing_token]}}'
        PPL_NAME: '#{PPL_Name}'
        RELEASE_NOTES: ''
      resources:
      - powershell
      tasks:
      - *fetch_builder_task
      - *expand_builder_task
      - fetch:
          run_if: passed
          stage: build_ppls
          job: Windows_32_Release
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/Windows_32_Release
      - fetch:
          run_if: passed
          stage: build_ppls
          job: Windows_32_Debug
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/Windows_32_Debug
      - fetch:
          run_if: passed
          stage: build_ppls
          job: Windows_64_Release
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/Windows_64_Release
      - fetch:
          run_if: passed
          stage: build_ppls
          job: Windows_64_Debug
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/Windows_64_Debug
      - fetch:
          run_if: passed
          stage: build_ppls
          job: cRIO_Release
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/cRIO_Release
      - fetch:
          run_if: passed
          stage: build_ppls
          job: cRIO_Debug
          is_file: false
          source: '#{PPL_Name}'
          destination: artifacts/cRIO_Debug
      - exec:
          run_if: passed
          command: dir
          arguments:
          - '*'
      - exec:
          run_if: passed
          command: py
          arguments:
          - '-3'
          - -u
          - PPL_Builder/publish_github.py
  job_base_2019_Windows_32_Release: &job_base_2019_Windows_32_Release
    timeout: 15
    elastic_profile_id: labview_2019_x86
    environment_variables:
      TARGET_NAME: Windows_32_Release
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: Windows
      IS_DEBUG_BUILD: 0
      BITNESS_FLAG: -v
      RELEASE_NOTES: ''
  job_base_2019_Windows_32_Debug: &job_base_2019_Windows_32_Debug
    timeout: 15
    elastic_profile_id: labview_2019_x86
    environment_variables:
      TARGET_NAME: Windows_32_Debug
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: Windows
      IS_DEBUG_BUILD: 1
      BITNESS_FLAG: -v
      RELEASE_NOTES: ''
  job_base_2019_Windows_64_Release: &job_base_2019_Windows_64_Release
    timeout: 15
    elastic_profile_id: labview_2019_x64
    environment_variables:
      TARGET_NAME: Windows_64_Release
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: Windows
      IS_DEBUG_BUILD: 0
      BITNESS_FLAG: --x64 -v
      RELEASE_NOTES: ''
  job_base_2019_Windows_64_Debug: &job_base_2019_Windows_64_Debug
    timeout: 15
    elastic_profile_id: labview_2019_x64
    environment_variables:
      TARGET_NAME: Windows_64_Debug
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: Windows
      IS_DEBUG_BUILD: 1
      BITNESS_FLAG: --x64 -v
      RELEASE_NOTES: ''
  job_base_2019_cRIO_Release: &job_base_2019_cRIO_Release
    timeout: 15
    elastic_profile_id: labview_2019_x86_crio
    environment_variables:
      TARGET_NAME: cRIO_Release
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: cRIO
      IS_DEBUG_BUILD: 0
      BITNESS_FLAG: -v
      RELEASE_NOTES: ''
  job_base_2019_cRIO_Debug: &job_base_2019_cRIO_Debug
    timeout: 15
    elastic_profile_id: labview_2019_x86_crio
    environment_variables:
      TARGET_NAME: cRIO_Debug
      BUILD_TYPE: BUILD
      TARGET_SYSTEM: cRIO
      IS_DEBUG_BUILD: 1
      BITNESS_FLAG: -v
      RELEASE_NOTES: ''
pipelines:
  ADC_StreamDatatypes.lvlibp:
    group: PPLs
    parameters:
      PPL_Name: ADC_StreamDatatypes.lvlibp
      PPL_LIB_PATH: Chakraborty_StreamDatatypes/Native Types/ADC_StreamDatatypes.lvlib
      GIT_DIR: Chakraborty_StreamDatatypes
      LV_VERSION: '2019'
      Dependency_PPL_Names: '"NS_ServerClient.lvlibp"'
    materials:
      builder: *builder_material
      Chakraborty_StreamDatatypes:
        git: git@github.com:oist/Chakraborty_StreamDatatypes
        destination: Chakraborty_StreamDatatypes
        auto_update: false
        shallow_clone: false
      NS_ServerClient.lvlibp_pipelineMaterial:
        pipeline: NS_ServerClient.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
    stages:
    - build_ppls:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          Windows_32_Release:
            <<: *job_base_2019_Windows_32_Release
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_Windows_32_Release_nipkg
                store_id: cicwin
                configuration: *nipkg_store_configuration
            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_Windows_32_Release
                pipeline: NS_ServerClient.lvlibp
                artifact_id: NS_ServerClient_Windows_32_Release_nipkg
            - *mklink_task_Windows_32_Release
            - *ls_current_dir_task
            - *ls_task
            - *gcli_build_task
            - *print_labview_logs_task
            - *create_crash_dump_dir_task
          Windows_32_Debug:
            <<: *job_base_2019_Windows_32_Debug
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_Windows_32_Debug_nipkg
                store_id: cicwin
                configuration: *nipkg_store_configuration
            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_Windows_32_Debug
                pipeline: NS_ServerClient.lvlibp
                artifact_id: NS_ServerClient_Windows_32_Debug_nipkg
            - *mklink_task_Windows_32_Debug
            - *ls_current_dir_task
            - *ls_task
            - *gcli_build_task
            - *print_labview_logs_task
            - *create_crash_dump_dir_task
          Windows_64_Release:
            <<: *job_base_2019_Windows_64_Release
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_Windows_64_Release_nipkg
                store_id: cicwin
                configuration: *nipkg_store_configuration
            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_Windows_64_Release
                pipeline: NS_ServerClient.lvlibp
                artifact_id: NS_ServerClient_Windows_64_Release_nipkg
            - *mklink_task_Windows_64_Release
            - *ls_current_dir_task
            - *ls_task
            - *gcli_build_task
            - *print_labview_logs_task
            - *create_crash_dump_dir_task
          Windows_64_Debug:
            <<: *job_base_2019_Windows_64_Debug
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_Windows_64_Debug_nipkg
                store_id: cicwin
                configuration: *nipkg_store_configuration
            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_Windows_64_Debug
                pipeline: NS_ServerClient.lvlibp
                artifact_id: NS_ServerClient_Windows_64_Debug_nipkg
            - *mklink_task_Windows_64_Debug
            - *ls_current_dir_task
            - *ls_task
            - *gcli_build_task
            - *print_labview_logs_task
            - *create_crash_dump_dir_task
          cRIO_Release:
            <<: *job_base_2019_cRIO_Release
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_cRIO_Release_nipkg
                store_id: cicwin
                configuration: *nipkg_store_configuration
            tasks:
            - *fetch_builder_task
            - *expand_builder_task
            - *create_ppl_dir_task
            - fetch:
                <<: *fetch_ppl_base_cRIO_Release
                pipeline: NS_ServerClient.lvlibp
                artifact_id: NS_ServerClient_cRIO_Release_nipkg
            - *mklink_task_cRIO_Release
            - *ls_current_dir_task
            - *ls_task
            - *gcli_build_task
            - *print_labview_logs_task
            - *create_crash_dump_dir_task
          cRIO_Debug:
            <<: *job_base_2019_cRIO_Debug
            artifacts:
            - *ppl_build_artifact
            - *nipkg_build_artifact
            - *crash_dumps_artifact
            - external:
                id: ADC_StreamDatatypes_cRIO_Debug_nipkg
                store_id: cicwin
