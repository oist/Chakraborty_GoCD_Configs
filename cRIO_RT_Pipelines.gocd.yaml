format_version: 10
pipelines:
  TC_cRIO_Application:
    group: cRIO
    parameters:
      GIT_DIR: Chakraborty_cRIO
      LV_VERSION: '2019'
      Dependency_PPL_Names: '"Acquisition Objects.lvlibp" "Actor Framework.lvlibp" "ADG Requests.lvlibp" "AF_Messages-PPL.lvlibp" "Baumer OM70 Modbus.lvlibp" "Communication Server.lvlibp" "DataStore.lvlibp" "Fanuc Interface.lvlibp" "Fanuc Proxy.lvlibp" "Fanuc_TCP.lvlibp" "Fanuc_TCPProxy.lvlibp" "Measurement Results.lvlibp" "Motor Activity Logging.lvlibp" "MResDatatype.lvlibp" "NS_ServerClient.lvlibp" "OIST_Error.lvlibp" "PMX32-2QU.lvlibp" "PowerSupplyInterface.lvlibp" "Request for Connection.lvlibp" "SQLite.lvlibp" "Status Reporting.lvlibp"'
      APP_NAME: TC_cRIO_Application
      BASE_PACKAGE_NAME: crio-9045-rt
      DEPLOY_BUILD_TYPE: debug
      PRERELEASE_TAG: ''
      TAG_PREFIX: RT-v
      MAIN_BRANCH: master
      BUILD_NUMBER_OFFSET: '540'
    environment_variables:
      PACKAGE_SERVER_UPLOAD_USER: pkgupload
      PACKAGE_SERVER_UPLOAD_KEY: ~/.ssh/id_rsa
      PACKAGE_SERVER_REFRESH_USER: opkg-refresher
      PACKAGE_SERVER_REFRESH_KEY: ~/.ssh/id_ed25519_opkg_refresh
      PACKAGE_SERVER: packages.chakraborty.lab
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
      Acquisition-Objects.lvlibp_pipelineMaterial:
        pipeline: Acquisition-Objects.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Actor-Framework.lvlibp_pipelineMaterial:
        pipeline: Actor-Framework.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      ADG-Requests.lvlibp_pipelineMaterial:
        pipeline: ADG-Requests.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      AF_Messages-PPL.lvlibp_pipelineMaterial:
        pipeline: AF_Messages-PPL.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Baumer-OM70-Modbus.lvlibp_pipelineMaterial:
        pipeline: Baumer-OM70-Modbus.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Communication-Server.lvlibp_pipelineMaterial:
        pipeline: Communication-Server.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      DataStore.lvlibp_pipelineMaterial:
        pipeline: DataStore.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc-Interface.lvlibp_pipelineMaterial:
        pipeline: Fanuc-Interface.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc-Proxy.lvlibp_pipelineMaterial:
        pipeline: Fanuc-Proxy.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc_TCP.lvlibp_pipelineMaterial:
        pipeline: Fanuc_TCP.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc_TCPProxy.lvlibp_pipelineMaterial:
        pipeline: Fanuc_TCPProxy.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Measurement-Results.lvlibp_pipelineMaterial:
        pipeline: Measurement-Results.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Motor-Activity-Logging.lvlibp_pipelineMaterial:
        pipeline: Motor-Activity-Logging.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      MResDatatype.lvlibp_pipelineMaterial:
        pipeline: MResDatatype.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      NS_ServerClient.lvlibp_pipelineMaterial:
        pipeline: NS_ServerClient.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      OIST_Error.lvlibp_pipelineMaterial:
        pipeline: OIST_Error.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      PMX32-2QU.lvlibp_pipelineMaterial:
        pipeline: PMX32-2QU.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      PowerSupplyInterface.lvlibp_pipelineMaterial:
        pipeline: PowerSupplyInterface.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Request-for-Connection.lvlibp_pipelineMaterial:
        pipeline: Request-for-Connection.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      SQLite.lvlibp_pipelineMaterial:
        pipeline: SQLite.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Status-Reporting.lvlibp_pipelineMaterial:
        pipeline: Status-Reporting.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Chakraborty_cRIO-Builder:
        git: git@github.com:oist/Chakraborty_cRIO-Builder
        destination: Chakraborty_cRIO-Builder
        auto_update: false
        shallow_clone: true
        branch: main
      cRIO_FPGA_Main_material:
        pipeline: cRIO_FPGA_Main_noncompile
        stage: build_fpga
        ignore_for_scheduling: false
      cRIO_FPGA_Expansion_material:
        pipeline: cRIO_FPGA_Expansion_noncompile
        stage: build_fpga
        ignore_for_scheduling: false
    stages:
    - version:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          compute_version:
            resources:
            - linux
            - python3
            timeout: 5
            artifacts:
            - build:
                source: version.txt
                destination: version/
            - build:
                source: Chakraborty_cRIO-Builder/scripts/*.sh
                destination: builder_scripts
            tasks:
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - set -euo pipefail; cd '#{GIT_DIR}'; python3 ../Chakraborty_cRIO-Builder/scripts/calculate_version.py --main-branch '#{MAIN_BRANCH}' --build-number-offset '#{BUILD_NUMBER_OFFSET}' --tag-prefix '#{TAG_PREFIX}' > ../version.txt
    - build:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: success
        jobs:
          build_debug:
            timeout: 15
            elastic_profile_id: labview_2019_x86_fpga
            environment_variables:
              IS_DEBUG_BUILD: 1
            artifacts:
            - build:
                source: '#{GIT_DIR}\builds\RT-Package-Debug\*'
                destination: '#{APP_NAME}_debug'
            tasks:
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Main_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Expansion_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - &id003
              exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - New-Item
                - -Force
                - -ItemType
                - Directory
                - -Path
                - \"C:\LabVIEW Sources\PPLs\"
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Acquisition-Objects.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Acquisition-Objects_cRIO_Debug_nipkg
                configuration: &id001
                  options:
                    DownloadOrInstall: Install
                    SuppressIncompatibilityErrors: false
                    AllowUpgrade: true
                    AllowDowngrade: true
                    AllowUninstallation: false
                    InstallRecommended: false
                    InstallRootDir: null
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Actor-Framework.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Actor-Framework_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: ADG-Requests.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: ADG-Requests_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
