        fetch_materials: 'no'
        clean_workspace: 'yes'
        approval: success
        jobs:
          publish_to_feed:
            resources:
            - linux
            timeout: 5
            tasks:
            - fetch:
                run_if: passed
                stage: build
                job: build_debug
                source: '#{APP_NAME}_debug'
                is_file: false
                destination: artifacts
            - fetch:
                run_if: passed
                stage: build
                job: build_release
                source: '#{APP_NAME}_release'
                is_file: false
                destination: artifacts
