    - publish_to_archive:
        fetch_materials: 'no'
        clean_workspace: 'yes'
        approval: success
        jobs:
          publish_to_feed:
            resources:
            - linux
            timeout: 5
            tasks:
            - fetch:
                run_if: passed
                stage: version
                job: compute_version
                source: version/version.txt
                destination: version
                is_file: true
            - fetch:
                run_if: passed
                stage: version
                job: compute_version
                source: builder_scripts
                is_file: false
                destination: .
            - fetch:
                run_if: passed
                stage: build
                job: build_debug
                source: '#{APP_NAME}_debug'
                is_file: false
                destination: artifacts
            - fetch:
                run_if: passed
                stage: build
                job: build_release
                source: '#{APP_NAME}_release'
                is_file: false
                destination: artifacts
            - &id010
              exec:
                run_if: any
                command: find
                arguments:
                - .
                - -type
                - f
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - scp -i ${PACKAGE_SERVER_UPLOAD_KEY} artifacts/#{APP_NAME}_*/*.ipk ${PACKAGE_SERVER_UPLOAD_USER}@${PACKAGE_SERVER}:/packages/
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - ssh -Ti ${PACKAGE_SERVER_REFRESH_KEY} ${PACKAGE_SERVER_REFRESH_USER}@${PACKAGE_SERVER}
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - bash builder_scripts/tag_rt_release.sh '#{PRERELEASE_TAG}'
    - deploy:
        fetch_materials: 'no'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          deploy_to_crio:
            resources:
            - linux
            environment_variables:
              CRIO_HOST: crio.chakraborty.lab
              CRIO_USER: crio-deploy
              CRIO_KNOWN_HOSTS_FILE: /run/secrets/crio_known_hosts
            timeout: 5
            tasks:
            - fetch:
                run_if: passed
                stage: version
                job: compute_version
                source: version/version.txt
                destination: version
                is_file: true
            - fetch:
                run_if: passed
                stage: version
                job: compute_version
                source: builder_scripts
                is_file: false
                destination: .
            - *id010
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
