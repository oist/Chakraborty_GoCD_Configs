                pipeline: Status-Reporting.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Status-Reporting_cRIO_Debug_nipkg
                configuration: *id001
            - exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - New-Item
                - -Force
                - -ItemType
                - Junction
                - -Path
                - PPLs\cRIO-9045\home
                - -Target
                - \"C:\LabVIEW Sources\PPLs\cRIO-9045\Debug_32\home\"
            - &id004
              plugin:
                run_if: passed
                options:
                  Url: https://ftp.ni.com/evaluation/labview/lvtn/vipm/packages/jdp_science_jsontext/jdp_science_jsontext-1.9.1.125.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: &id002
                  id: jp.oist.chakraborty.vi-package-installer
                  version: '0.1'
            - &id005
              plugin:
                run_if: passed
                options:
                  Url: https://ftp.ni.com/evaluation/labview/lvtn/vipm/packages/jdp_science_lib_common_utilities/jdp_science_lib_common_utilities-1.4.2.19.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: *id002
            - &id006
              plugin:
                run_if: passed
                options:
                  Url: https://github.com/MediaMongrels-Ltd/LabVIEW-WebSockets-API/releases/download/V2.0.2.41/mediamongrels_ltd_lib_websockets_api-2.0.2.41.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: *id002
            - &id007
              fetch:
                run_if: passed
                stage: version
                job: compute_version
                source: version/version.txt
                destination: '#{GIT_DIR}'
                is_file: true
            - &id008
              exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - Get-ChildItem
                - -Recurse
                - -Depth
                - '1'
            - &id009
              exec:
                run_if: passed
                command: g-cli
                arguments:
                - --lv-ver
                - '#{LV_VERSION}'
                - --verbose
                - Chakraborty_cRIO-Builder\LabVIEW_BuildTools\RT\Build_RT_Application.vi
                - --
                - '#{GIT_DIR}\cRIO-9045-RT.lvproj'
                - RT CompactRIO Target
                - RT Main Application
                - '%IS_DEBUG_BUILD%'
                - '#{PRERELEASE_TAG}'
                - '#{Dependency_PPL_Names}'
          build_release:
            timeout: 15
            elastic_profile_id: labview_2019_x86_fpga
            environment_variables:
              IS_DEBUG_BUILD: 0
            artifacts:
            - build:
                source: '#{GIT_DIR}\builds\RT-Package-Release\*'
                destination: '#{APP_NAME}_release'
            tasks:
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Main_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Expansion_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - *id003
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Acquisition-Objects.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Acquisition-Objects_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Actor-Framework.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Actor-Framework_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
