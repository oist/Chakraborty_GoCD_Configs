        ignore_for_scheduling: false
      Status-Reporting.lvlibp_pipelineMaterial: &id031
        pipeline: Status-Reporting.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      cRIO_FPGA_Main_material:
        pipeline: cRIO_FPGA_Main_noncompile
        stage: build_fpga
        ignore_for_scheduling: false
      cRIO_FPGA_Expansion_material:
        pipeline: cRIO_FPGA_Expansion_noncompile
        stage: build_fpga
        ignore_for_scheduling: false
    stages:
    - build:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          build_debug: &id032
            timeout: 15
            elastic_profile_id: labview_2019_x86_crio
            environment_variables:
              IS_DEBUG_BUILD: 1
            artifacts:
            - build:
                source: '#{GIT_DIR}\builds\RT-Package-Debug\*'
                destination: '#{APP_NAME}_debug'
            tasks:
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Main_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Expansion_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - &id003
