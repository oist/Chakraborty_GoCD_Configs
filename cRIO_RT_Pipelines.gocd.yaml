      DEPLOY_BUILD_TYPE: debug
      PRERELEASE_TAG: ''
    environment_variables:
      BUILD_TYPE: BUILD
      CRIO_HOST: ''
      CRIO_USER: admin
      PACKAGE_SERVER_UPLOAD_USER: pkgupload
      PACKAGE_SERVER_UPLOAD_KEY: ~/.ssh/id_rsa
      PACKAGE_SERVER_REFRESH_USER: opkg-refresher
      PACKAGE_SERVER_REFRESH_KEY: ~/.ssh/id_ed25519_opkg_refresh
      PACKAGE_SERVER: packages.chakraborty.lab
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
      Acquisition-Objects.lvlibp_pipelineMaterial: &id010
        pipeline: Acquisition-Objects.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Actor-Framework.lvlibp_pipelineMaterial: &id011
        pipeline: Actor-Framework.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      ADG-Requests.lvlibp_pipelineMaterial: &id012
