        stage: build_ppls
        ignore_for_scheduling: false
      AF_Messages-PPL.lvlibp_pipelineMaterial: &id013
        pipeline: AF_Messages-PPL.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Baumer-OM70-Modbus.lvlibp_pipelineMaterial: &id014
        pipeline: Baumer-OM70-Modbus.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Communication-Server.lvlibp_pipelineMaterial: &id015
        pipeline: Communication-Server.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      DataStore.lvlibp_pipelineMaterial: &id016
        pipeline: DataStore.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc-Interface.lvlibp_pipelineMaterial: &id017
        pipeline: Fanuc-Interface.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc-Proxy.lvlibp_pipelineMaterial: &id018
        pipeline: Fanuc-Proxy.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc_TCP.lvlibp_pipelineMaterial: &id019
        pipeline: Fanuc_TCP.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Fanuc_TCPProxy.lvlibp_pipelineMaterial: &id020
        pipeline: Fanuc_TCPProxy.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Measurement-Results.lvlibp_pipelineMaterial: &id021
        pipeline: Measurement-Results.lvlibp
        stage: build_ppls
        ignore_for_scheduling: false
      Motor-Activity-Logging.lvlibp_pipelineMaterial: &id022
        pipeline: Motor-Activity-Logging.lvlibp
        stage: build_ppls
