                stage: build_ppls
                job: cRIO_Debug
                artifact_id: PMX32-2QU_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: OIST_Error.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: OIST_Error_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: PowerSupplies-Serial.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: PowerSupplies-Serial_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: PowerSupplyInterface.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: PowerSupplyInterface_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Request-for-Connection.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Request-for-Connection_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Serial-Communication.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Serial-Communication_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: SQLite.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: SQLite_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Status-Reporting.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: Status-Reporting_cRIO_Debug_nipkg
                configuration: *id001
            - exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - New-Item
                - -Force
                - -ItemType
                - Junction
                - -Path
                - PPLs\cRIO-9045\home
                - -Target
                - \"C:\LabVIEW Sources\PPLs\cRIO-9045\Debug_32\home\"
            - &id006
              plugin:
                run_if: passed
                options:
                  Url: https://ftp.ni.com/evaluation/labview/lvtn/vipm/packages/jdp_science_jsontext/jdp_science_jsontext-1.9.1.125.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: &id002
                  id: jp.oist.chakraborty.vi-package-installer
                  version: '0.1'
            - &id007
              plugin:
                run_if: passed
                options:
                  Url: https://ftp.ni.com/evaluation/labview/lvtn/vipm/packages/jdp_science_lib_common_utilities/jdp_science_lib_common_utilities-1.4.2.19.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: *id002
            - &id008
              plugin:
                run_if: passed
                options:
                  Url: https://github.com/MediaMongrels-Ltd/LabVIEW-WebSockets-API/releases/download/V2.0.2.41/mediamongrels_ltd_lib_websockets_api-2.0.2.41.vip
                  LabVIEWDirectory: C:\Program Files (x86)\National Instruments\LabVIEW 2019
                  Verbose: false
                configuration: *id002
            - &id009
              exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - Get-ChildItem
                - -Recurse
                - -Depth
                - '1'
            - &id010
              exec:
                run_if: passed
                command: g-cli
                arguments:
                - --lv-ver
                - '#{LV_VERSION}'
                - --verbose
                - Builder\Build_RT_Application.vi
                - --
                - cRIO-9045-RT.lvproj
                - RT CompactRIO Target
                - RT Main Application
                - '%BUILD_TYPE%'
                - '%IS_DEBUG_BUILD%'
                - '#{Dependency_PPL_Names}'
                working_directory: '#{GIT_DIR}'
          build_release:
            timeout: 15
            elastic_profile_id: labview_2019_x86_crio
            environment_variables:
              IS_DEBUG_BUILD: 0
              BUILD_TYPE: '#{BUILD_TYPE}'
            artifacts:
            - build:
                source: builds/cRIO-9045-RT
                destination: '#{APP_NAME}'
            tasks:
            - *id003
            - *id004
            - *id005
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Acquisition-Objects.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Acquisition-Objects_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Actor-Framework.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Actor-Framework_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: ADG-Requests.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: ADG-Requests_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: AF_Messages-PPL.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: AF_Messages-PPL_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Baumer-OM70-Modbus.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Baumer-OM70-Modbus_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Communication-Server.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Communication-Server_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: DataStore.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: DataStore_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Fanuc-Interface.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Fanuc-Interface_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Fanuc-Proxy.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Fanuc-Proxy_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Fanuc_TCP.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Fanuc_TCP_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Fanuc_TCPProxy.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Fanuc_TCPProxy_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Measurement-Results.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Measurement-Results_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Motor-Activity-Logging.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Motor-Activity-Logging_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: MResDatatype.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: MResDatatype_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: PMX32-2QU.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: PMX32-2QU_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: OIST_Error.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: OIST_Error_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: PowerSupplies-Serial.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: PowerSupplies-Serial_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: PowerSupplyInterface.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: PowerSupplyInterface_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Request-for-Connection.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Request-for-Connection_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Serial-Communication.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Serial-Communication_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: SQLite.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: SQLite_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Status-Reporting.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Status-Reporting_cRIO_Release_nipkg
                configuration: *id001
            - exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - New-Item
                - -Force
                - -ItemType
                - Junction
                - -Path
                - PPLs\cRIO-9045\home
                - -Target
                - \"C:\LabVIEW Sources\PPLs\cRIO-9045\Release_32\home\"
            - *id006
            - *id007
            - *id008
            - *id009
            - *id010
    - build_packages:
        fetch_materials: 'no'
        clean_workspace: 'no'
        approval: success
        jobs:
          package_debug:
            timeout: 10
            elastic_profile_id: labview_2019_x86_crio
            artifacts:
            - build:
                source: builds/packages/*.ipkg
                destination: packages
            tasks:
            - fetch:
                run_if: passed
                stage: build
                job: build_debug
                source: '#{APP_NAME}'
                destination: builds
            - exec:
                run_if: passed
                command: LabVIEWCLI.exe
                arguments:
                - -OperationName
                - ExecuteBuildSpec
                - -Verbosity
                - Detailed
                - -ProjectPath
                - '"C:\LabVIEW Sources\#{GIT_DIR}\cRIO-9045-RT.lvproj"'
                - -TargetName
                - RT CompactRIO Target
                - -BuildSpecName
                - cRIO Package - Debug
          package_release:
            timeout: 10
            elastic_profile_id: labview_2019_x86_crio
            artifacts:
            - build:
                source: builds/packages/*.ipkg
                destination: packages
            tasks:
            - fetch:
                run_if: passed
                stage: build
                job: build_release
                source: '#{APP_NAME}'
                destination: builds
            - exec:
                run_if: passed
                command: LabVIEWCLI.exe
                arguments:
                - -OperationName
                - ExecuteBuildSpec
                - -Verbosity
                - Detailed
                - -ProjectPath
                - '"C:\LabVIEW Sources\#{GIT_DIR}\cRIO-9045-RT.lvproj"'
                - -TargetName
                - RT CompactRIO Target
                - -BuildSpecName
                - cRIO Package - Release
    - publish_to_archive:
        fetch_materials: 'no'
        clean_workspace: 'no'
        approval: success
        jobs:
          publish_to_feed:
            timeout: 5
            environment_variables:
              PACKAGE_SERVER: '#{PACKAGE_SERVER}'
            tasks:
            - fetch:
                run_if: passed
                stage: build_packages
                job: package_release
                source: packages
                destination: artifacts
            - exec:
                run_if: passed
                command: scp
                arguments:
                - artifacts/packages/*.ipkg
                - '#{PACKAGE_SERVER}:/var/www/packages/'
            - exec:
                run_if: passed
                command: ssh
                arguments:
                - '#{PACKAGE_SERVER}'
                - cd /var/www/packages && opkg-make-index . > Packages && gzip -c Packages > Packages.gz
    - deploy:
        fetch_materials: 'no'
        clean_workspace: 'no'
        approval: manual
        jobs:
          deploy_to_crio:
            timeout: 5
            environment_variables:
              CRIO_HOST: '#{CRIO_HOST}'
              CRIO_USER: '#{CRIO_USER}'
            tasks:
            - fetch:
                run_if: passed
                stage: build_packages
                job: package_#{DEPLOY_BUILD_TYPE}
                source: packages
                destination: artifacts
            - exec:
                run_if: passed
                command: sshpass
                arguments:
                - -p
                - '{{SECRET:[secrets.json][crio_ssh_password]}}'
                - scp
                - -o
                - StrictHostKeyChecking=no
                - artifacts/packages/*.ipkg
                - '#{CRIO_USER}@#{CRIO_HOST}:/tmp/'
            - exec:
                run_if: passed
                command: sshpass
                arguments:
                - -p
                - '{{SECRET:[secrets.json][crio_ssh_password]}}'
                - ssh
                - -o
                - StrictHostKeyChecking=no
                - '#{CRIO_USER}@#{CRIO_HOST}'
                - opkg remove tc-crio-app || true; opkg install /tmp/*.ipkg
            - exec:
                run_if: passed
                command: sshpass
                arguments:
                - -p
                - '{{SECRET:[secrets.json][crio_ssh_password]}}'
                - ssh
                - -o
                - StrictHostKeyChecking=no
                - '#{CRIO_USER}@#{CRIO_HOST}'
                - /etc/init.d/niapp restart || systemctl restart niapp
