                run_if: passed
                command: bash
                arguments:
                - -lc
                - scp -i ${PACKAGE_SERVER_UPLOAD_KEY} artifacts/#{APP_NAME}_*/*.ipk ${PACKAGE_SERVER_UPLOAD_USER}@${PACKAGE_SERVER}:/packages/
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - ssh -Ti ${PACKAGE_SERVER_REFRESH_KEY} ${PACKAGE_SERVER_REFRESH_USER}@${PACKAGE_SERVER}
            - exec:
                run_if: passed
                command: bash
                arguments:
                - -lc
                - set -euo pipefail; IPK="$(ls -1 artifacts/#{APP_NAME}_release/*.ipk | head -n1)"; BASE="$(basename "$IPK" .ipk)"; BUILD_VER_RAW="$(printf '%s\n' "$BASE" | sed -E 's/^.*_([^_]*)_[^_]*$/\1/')"; BUILD_VER="$(printf '%s\n' "$BUILD_VER_RAW" | sed -E 's/^(.*)-([^-]+)$/\1.\2/')"; PT='#{PRERELEASE_TAG}'; TAG="RT-v${BUILD_VER}${PT:+-${PT}}"; REPO_URL="${GO_MATERIAL_URL_CHAKRABORTY_CRIO:?GO_MATERIAL_URL_CHAKRABORTY_CRIO is required}"; REV="${GO_REVISION_CHAKRABORTY_CRIO:?GO_REVISION_CHAKRABORTY_CRIO is required}"; WORKDIR="$(mktemp -d)"; trap "rm -rf ${WORKDIR}" EXIT; git -C "$WORKDIR" init -q; git -C "$WORKDIR" remote add origin "$REPO_URL"; git -C "$WORKDIR" fetch --depth=1 origin "$REV"; git -C "$WORKDIR" tag -a "$TAG" "$REV" -m "RT build $TAG"; git -C "$WORKDIR" push origin "$TAG"
    - deploy: &id035
        fetch_materials: 'no'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          deploy_to_crio:
            resources:
            - linux
            timeout: 5
            tasks:
            - fetch:
                run_if: passed
                stage: build
                job: build_#{DEPLOY_BUILD_TYPE}
                source: '#{APP_NAME}_#{DEPLOY_BUILD_TYPE}'
                destination: artifacts
            - *id009
            - exec:
                run_if: passed
                command: bash
