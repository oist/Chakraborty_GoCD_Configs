              exec:
                run_if: passed
                command: g-cli
                arguments:
                - --lv-ver
                - '#{LV_VERSION}'
                - --verbose
                - Builder\Build_RT_Application.vi
                - --
                - cRIO-9045-RT.lvproj
                - RT CompactRIO Target
                - RT Main Application
                - '%BUILD_TYPE%'
                - '%IS_DEBUG_BUILD%'
                - '#{Dependency_PPL_Names}'
                working_directory: '#{GIT_DIR}'
          build_release: &id033
            timeout: 15
            elastic_profile_id: labview_2019_x86_crio
            environment_variables:
              IS_DEBUG_BUILD: 0
            artifacts:
            - build:
                source: '#{GIT_DIR}\builds\RT-Package-Release\*'
                destination: '#{APP_NAME}_release'
            tasks:
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Main_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - fetch:
                run_if: passed
                pipeline: cRIO_FPGA_Expansion_noncompile
                stage: build_fpga
                job: build_fpga
                is_file: false
                source: FPGA Bitfiles
                destination: FPGA Bitfiles/
            - *id003
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Acquisition-Objects.lvlibp
                stage: build_ppls
                job: cRIO_Release
                artifact_id: Acquisition-Objects_cRIO_Release_nipkg
                configuration: *id001
            - fetch:
                run_if: passed
                artifact_origin: external
                pipeline: Actor-Framework.lvlibp
                stage: build_ppls
                job: cRIO_Release
