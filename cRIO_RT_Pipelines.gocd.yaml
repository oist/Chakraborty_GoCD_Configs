                artifact_origin: external
                pipeline: AF_Messages-PPL.lvlibp
                stage: build_ppls
                job: cRIO_Debug
                artifact_id: AF_Messages-PPL_cRIO_Debug_nipkg
                configuration: *id001
            - fetch:
