format_version: 10
pipelines:
  cRIO_FPGA_Main:
    group: cRIO
    parameters:
      GIT_DIR: Chakraborty_cRIO
      LV_VERSION: '2019'
      FPGA_TARGET_NAME: FPGA Target
      FPGA_BUILDSPEC_NAME: FPGA Main
      PROJECT_PATH: Chakraborty_cRIO\cRIO-9045-RT.lvproj
      VERSION_VI_PATH: FPGA/FPGA Version Number.vi
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
      Chakraborty_cRIO-Builder: &id001
        git: git@github.com:oist/Chakraborty_cRIO-Builder
        destination: Chakraborty_cRIO-Builder
        auto_update: false
        shallow_clone: true
        branch: main
    stages:
    - build_fpga:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          build_fpga:
            timeout: 90
            elastic_profile_id: labview_2019_x86_fpga
            artifacts:
            - build:
                source: FPGA Bitfiles/*.lvbitx
                destination: FPGA Bitfiles
            tasks:
            - &id002
              exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - New-Item
                - -Force
                - -ItemType
                - Directory
                - -Path
                - \"C:\LabVIEW Sources\PPLs\"
            - &id003
              exec:
                run_if: passed
                command: ls
                arguments:
                - '*'
            - &id004
              exec:
                run_if: passed
                command: powershell
                arguments:
                - -Command
                - Get-ChildItem
                - -Recurse
                - -Depth
                - '1'
            - &id005
              exec:
                run_if: passed
                command: g-cli
                arguments:
                - --lv-ver
                - '#{LV_VERSION}'
                - --verbose
                - Chakraborty_cRIO-Builder\LabVIEW_BuildTools\FPGA\Script_FPGA_Version_VI_Wrapper.vi
                - --
                - '#{GIT_DIR}\#{VERSION_VI_PATH}'
            - &id006
              exec:
                run_if: passed
                command: g-cli
                arguments:
                - --lv-ver
                - '#{LV_VERSION}'
                - --verbose
                - Chakraborty_cRIO-Builder\LabVIEW_BuildTools\FPGA\FPGA_Compile_GCLI.vi
                - --
                - '#{PROJECT_PATH}'
                - '#{FPGA_TARGET_NAME}'
                - '#{FPGA_BUILDSPEC_NAME}'
  cRIO_FPGA_Expansion:
    group: cRIO
    parameters:
      GIT_DIR: Chakraborty_cRIO
      LV_VERSION: '2019'
      FPGA_TARGET_NAME: FPGA Target 2
      FPGA_BUILDSPEC_NAME: Main
      PROJECT_PATH: Chakraborty_cRIO\cRIO-9045-RT.lvproj
      VERSION_VI_PATH: FPGA Expansion/FPGA Expansion Version Number.vi
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
      Chakraborty_cRIO-Builder: *id001
    stages:
    - build_fpga:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          build_fpga:
            timeout: 90
            elastic_profile_id: labview_2019_x86_fpga
            artifacts:
            - build:
                source: FPGA Bitfiles/*.lvbitx
                destination: FPGA Bitfiles
            tasks:
            - *id002
            - *id003
            - *id004
            - *id005
            - *id006
  cRIO_FPGA_Main_noncompile:
    group: cRIO
    parameters:
      GIT_DIR: Chakraborty_cRIO
      LV_VERSION: '2019'
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
    stages:
    - build_fpga:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          build_fpga:
            timeout: 5
            elastic_profile_id: labview_2019_x86_fpga
            artifacts:
            - build:
                source: Chakraborty_cRIO/FPGA Bitfiles/cR9045-FPGAMain_tiGh-z7G0kw.lvbitx
                destination: FPGA Bitfiles
            tasks:
            - *id003
            - *id004
  cRIO_FPGA_Expansion_noncompile:
    group: cRIO
    parameters:
      GIT_DIR: Chakraborty_cRIO
      LV_VERSION: '2019'
    materials:
      Chakraborty_cRIO:
        git: git@github.com:oist/Chakraborty_cRIO
        destination: Chakraborty_cRIO
        auto_update: false
        shallow_clone: false
        branch: master
    stages:
    - build_fpga:
        fetch_materials: 'yes'
        clean_workspace: 'yes'
        approval: manual
        jobs:
          build_fpga:
            timeout: 5
            elastic_profile_id: labview_2019_x86_fpga
            artifacts:
            - build:
                source: Chakraborty_cRIO/FPGA Bitfiles/crio-9045-rt_FPGATarget2_Main_yKmXqsdb6fY.lvbitx
                destination: FPGA Bitfiles
            tasks:
            - *id003
            - *id004
